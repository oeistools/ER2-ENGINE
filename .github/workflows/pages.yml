name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "_extensions/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one deployment at a time; never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install ER2
        run: uv tool install --with matplotlib er2==0.7.0

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      # The site runs the engine on every page, so a broken engine must fail
      # the build rather than quietly publishing a page with no results.
      - name: Render the documentation site
        run: quarto render docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
