# The Python in this repository is the runner the engine starts,
# _extensions/er2/er2_runner.py, and tools/make_logo.py. This file exists to
# configure ruff for them; nothing here is a package.

[tool.ruff]
# The runner must work on every Python ER2 supports.
target-version = "py312"
line-length = 79  # PEP 8, as in ER2

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
